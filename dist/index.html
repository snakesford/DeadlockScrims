<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A simple home for your tier list. Add names, sort your roster, and save as you go."><title>Roster — Tier List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a class="brand" href="./"><span class="logo">▥</span> roster<span class="brand-dot">.</span></a><span class="header-note">A little order for your lineup.</span><span class="local"><i></i> Saved on this device</span></header>
<main>
<div class="intro"><div><p class="eyebrow">YOUR PEOPLE, IN PLACE</p><h1>Make your lineup.</h1><p class="subtitle">Add a name. Pick a tier. Find where everyone fits.</p></div><div class="total"><strong id="total">0</strong><span>names on the board</span></div></div>
<section class="quick-add" aria-label="Add a name"><form id="add-form"><label for="name">Add to the board</label><div class="fields"><input id="name" placeholder="Enter a name…" maxlength="60" required autocomplete="off"><select id="tier" aria-label="Choose a tier"><option value="unsorted">Unsorted</option><option value="high">High</option><option value="mid">Mid</option><option value="newer">Newer</option></select><button class="primary" type="submit"><span>＋</span> Add name</button></div></form></section>
<div class="board-heading"><h2>The tier list <span id="tier-count">3 tiers</span></h2><span class="hint">Drag names to sort, or use their menu <span>↗</span></span></div>
<div id="board"></div>
<p id="status" role="status" aria-live="polite"></p>
</main>
<dialog id="edit-dialog"><form id="edit-form"><div class="dialog-heading"><h2>Edit name</h2><button type="button" id="close" aria-label="Close">×</button></div><label for="edit-name">Name</label><input id="edit-name" maxlength="60" required><label for="edit-tier">Tier</label><select id="edit-tier"><option value="high">High</option><option value="mid">Mid</option><option value="newer">Newer</option><option value="unsorted">Unsorted</option></select><div class="dialog-actions"><button type="button" id="delete">Remove name</button><button class="primary">Save changes</button></div></form></dialog>
<script src="app.js"></script>
</body></html>
